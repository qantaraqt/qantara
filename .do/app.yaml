name: qantara
region: nyc
static_sites:
  - name: qantara-web
    github:
      repo: qantaraqt/qantara
      branch: main
      deploy_on_push: true
    build_command: npm run build
    output_dir: dist
    environment_slug: node-js
    source_dir: /
    catchall_document: 404.html
    routes:
      - path: /
